<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星语粒子 · 银河光圈鼠标版</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#01020a;color:#d8f4ff;font:13px system-ui}#hud{position:fixed;inset:24px;border:1px solid #286b9b;padding:20px;pointer-events:none;box-shadow:inset 0 0 100px #061838}.hint{position:absolute;bottom:20px;color:#83a9cc}</style></head><body><div id="hud">STELLAR VOICE / SATIN GALAXY RING<div class="hint">移动鼠标旋转并聚合三人轮廓 · 滚轮缩放</div></div><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';const N=52000,s=new T.Scene(),c=new T.PerspectiveCamera(52,innerWidth/innerHeight,.1,100),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);const g=new T.BufferGeometry(),p=new Float32Array(N*3),to=new Float32Array(N*3),co=new Float32Array(N*3),sz=new Float32Array(N);function person(i){let k=i%3,x=k===0?-1.7:k===1?0:1.7,t=Math.random()*6.28,head=i%5<3,rx=head?.8:1.15,ry=head?1.0:1.35;return[x+Math.cos(t)*rx*(.7+Math.random()*.3),head?1.25+Math.sin(t)*ry*(.7+Math.random()*.3):-.55+Math.random()*1.5,(Math.random()-.5)*.45]}for(let i=0;i<N;i++){let j=i*3,a=Math.random()*6.28,rad=1.1+Math.pow(Math.random(),.55)*5,th=(Math.random()-.5)*.18;p[j]=Math.cos(a)*rad;p[j+1]=Math.sin(a)*rad*.35+th;p[j+2]=Math.sin(a)*rad*.24+th*2;let q=person(i);to[j]=q[0];to[j+1]=q[1];to[j+2]=q[2];let k=i%4;co[j]=k===0?1:k===1?.45:k===2?.2:.65;co[j+1]=k===0?.3:k===1?.1:k===2?.75:.45;co[j+2]=k===0?.08:k===1?.9:k===2?1:1;sz[i]=1.7+Math.random()*3}g.setAttribute('position',new T.BufferAttribute(p,3));g.setAttribute('color',new T.BufferAttribute(co,3));g.setAttribute('size',new T.BufferAttribute(sz,1));const mat=new T.ShaderMaterial({transparent:true,depthWrite:false,vertexColors:true,blending:T.AdditiveBlending,vertexShader:'attribute float size;varying vec3 v;void main(){v=color;vec4 q=modelViewMatrix*vec4(position,1.);gl_PointSize=size*(280./-q.z);gl_Position=projectionMatrix*q}',fragmentShader:'varying vec3 v;void main(){vec2 q=gl_PointCoord-.5;float d=dot(q,q),g=exp(-28.*d),core=smoothstep(.12,0.,d);gl_FragColor=vec4(v*(g+core),g+core)}'});const pts=new T.Points(g,mat);s.add(pts);c.position.z=9;let mx=0,my=0,z=9,morph=0;addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5)*1.8;my=-(e.clientY/innerHeight-.5)*1.1;morph=e.clientY/innerHeight});addEventListener('wheel',e=>z=Math.max(5,Math.min(15,z+e.deltaY*.01)));function loop(t){requestAnimationFrame(loop);let a=g.attributes.position.array;for(let i=0;i<a.length;i++)a[i]+=(to[i]*morph-a[i])*.025;pts.rotation.y+=(mx-pts.rotation.y)*.03;pts.rotation.x+=(my-pts.rotation.x)*.03;pts.rotation.z+=.0007;c.position.z+=(z-c.position.z)*.04;r.render(s,c)}loop(0)</script></body></html>
