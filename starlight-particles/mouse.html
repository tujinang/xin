<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星语粒子·鼠标版</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#ffd9ae;font:14px sans-serif}#hud{position:fixed;z-index:2;inset:24px;border:1px solid #6b4628;padding:20px;pointer-events:none}#hint{position:absolute;bottom:20px;left:20px;color:#a78f80}</style><div id="hud">STELLAR VOICE / MOUSE EDITION<div id="hint">移动鼠标：旋转并变成人物轮廓 · 滚轮：缩放</div></div><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';const s=new T.Scene(),c=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,100),r=new T.WebGLRenderer({antialias:true}),N=52000,g=new T.BufferGeometry(),a=new Float32Array(N*3),b=new Float32Array(N*3),col=new Float32Array(N*3);function ell(cx,cy,rx,ry,z){return[cx+Math.cos(z)*rx*(.7+Math.random()*.3),cy+Math.sin(z)*ry*(.7+Math.random()*.3), (Math.random()-.5)*.5]}for(let i=0;i<N;i++){let j=i*3,u=Math.random()*2-1,q=Math.sqrt(1-u*u),z=Math.random()*6.28,rad=3.2*(.8+Math.random()*.4);a[j]=q*Math.cos(z)*rad;a[j+1]=u*rad;a[j+2]=q*Math.sin(z)*rad;if(i<N*.55){let k=i%3,p=k===0?-1.65:k===1?0:1.65,head=ell(p,1.3,.85,1.05,z);b[j]=head[0];b[j+1]=head[1];b[j+2]=head[2]}else{let k=i%3,p=k===0?-1.65:k===1?0:1.65;b[j]=p+(Math.random()-.5)*1.5;b[j+1]=-.55+Math.random()*1.5;b[j+2]=(Math.random()-.5)*.4}col[j]=[1,.35,.8][i%3];col[j+1]=[.2,.55,.8][i%3];col[j+2]=[.08,.9,1][i%3]}g.setAttribute('position',new T.BufferAttribute(a,3));g.setAttribute('color',new T.BufferAttribute(col,3));const p=new T.Points(g,new T.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.92,blending:T.AdditiveBlending}));s.add(p);c.position.z=8;r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);let tx=0,ty=0,z=8,morph=0;addEventListener('mousemove',e=>{tx=(e.clientX/innerWidth-.5)*5;ty=-(e.clientY/innerHeight-.5)*3;morph=Math.min(1,Math.max(0,e.clientY/innerHeight*1.35))});addEventListener('wheel',e=>z=Math.max(4.8,Math.min(15,z+e.deltaY*.01)));function loop(){requestAnimationFrame(loop);let pos=g.attributes.position.array;for(let i=0;i<N*3;i++)pos[i]+=(a[i]*(1-morph)+b[i]*morph-pos[i])*.045;c.position.z+=(z-c.position.z)*.05;p.rotation.y+=(tx-p.rotation.y)*.04;p.rotation.x+=(ty-p.rotation.x)*.04;p.rotation.y+=.001;r.render(s,c)}loop();</script></html>
