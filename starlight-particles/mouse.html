<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星语粒子·鼠标版</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#ffd9ae;font:14px sans-serif}#hud{position:fixed;z-index:2;inset:24px;border:1px solid #6b4628;padding:20px;pointer-events:none}#hint{position:absolute;bottom:20px;left:20px;color:#a78f80}</style></head><body><div id="hud">STELLAR VOICE / MOUSE EDITION<div id="hint">移动鼠标旋转粒子 · 滚轮缩放</div></div><script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';let s=new THREE.Scene(),c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100),r=new THREE.WebGLRenderer({antialias:true}),g=new THREE.BufferGeometry(),n=52000,a=new Float32Array(n*3),co=new Float32Array(n*3);for(let i=0;i<n;i++){let u=Math.random()*2-1,q=Math.sqrt(1-u*u),z=Math.random()*6.28,j=i*3;a[j]=q*Math.cos(z)*3.2*(.8+Math.random()*.4);a[j+1]=u*3.2;a[j+2]=q*Math.sin(z)*3.2*(.8+Math.random()*.4);co[j]=1;co[j+1]=.2+Math.random()*.5;co[j+2]=.05}g.setAttribute('position',new THREE.BufferAttribute(a,3));g.setAttribute('color',new THREE.BufferAttribute(co,3));let p=new THREE.Points(g,new THREE.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));s.add(p);c.position.z=8;r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);let tx=0,ty=0,z=8;addEventListener('mousemove',e=>{tx=(e.clientX/innerWidth-.5)*5;ty=-(e.clientY/innerHeight-.5)*3});addEventListener('wheel',e=>{z=Math.max(4.8,Math.min(15,z+e.deltaY*.01))});function loop(){requestAnimationFrame(loop);c.position.z+=(z-c.position.z)*.05;p.rotation.y+=(tx-p.rotation.y)*.04;p.rotation.x+=(ty-p.rotation.x)*.04;p.rotation.y+=.001;r.render(s,c)}loop();</script></body></html>
