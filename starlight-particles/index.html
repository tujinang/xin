<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星语粒子 · 银河光圈手势版</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#01020a;color:#d8f4ff;font:13px system-ui}#hud{position:fixed;inset:24px;border:1px solid #286b9b;padding:20px;pointer-events:none;box-shadow:inset 0 0 100px #061838}#status{float:right}#cameraBtn{position:fixed;z-index:3;right:45px;bottom:45px;padding:10px;background:#071a30;color:#bdeeff;border:1px solid #60cfff;cursor:pointer}video{position:fixed;z-index:2;right:45px;bottom:90px;width:160px;opacity:.5;transform:scaleX(-1)}</style></head><body><div id="hud">STELLAR VOICE / HAND EDITION <span id="status">点击启动摄像头</span><p>张掌：人物聚合 · 握拳：银河光圈 · 移动手掌：旋转</p></div><button id="cameraBtn">启动摄像头</button><video id="video" autoplay muted playsinline></video><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';import{HandLandmarker,FilesetResolver}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';const N=52000,s=new T.Scene(),c=new T.PerspectiveCamera(52,innerWidth/innerHeight,.1,100),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);const g=new T.BufferGeometry(),p=new Float32Array(N*3),to=new Float32Array(N*3),co=new Float32Array(N*3),sz=new Float32Array(N);function person(i){let k=i%3,x=k===0?-1.7:k===1?0:1.7,t=Math.random()*6.28,head=i%5<3,rx=head?.8:1.15,ry=head?1.0:1.35;return[x+Math.cos(t)*rx*(.7+Math.random()*.3),head?1.25+Math.sin(t)*ry*(.7+Math.random()*.3):-.55+Math.random()*1.5,(Math.random()-.5)*.45]}for(let i=0;i<N;i++){let j=i*3,a=Math.random()*6.28,rad=1.1+Math.pow(Math.random(),.55)*5,th=(Math.random()-.5)*.18;p[j]=Math.cos(a)*rad;p[j+1]=Math.sin(a)*rad*.35+th;p[j+2]=Math.sin(a)*rad*.24+th*2;let q=person(i);to[j]=q[0];to[j+1]=q[1];to[j+2]=q[2];let k=i%4;co[j]=k===0?1:k===1?.45:k===2?.2:.65;co[j+1]=k===0?.3:k===1?.1:k===2?.75:.45;co[j+2]=k===0?.08:k===1?.9:k===2?1:1;sz[i]=1.7+Math.random()*3}g.setAttribute('position',new T.BufferAttribute(p,3));g.setAttribute('color',new T.BufferAttribute(co,3));g.setAttribute('size',new T.BufferAttribute(sz,1));const mat=new T.ShaderMaterial({transparent:true,depthWrite:false,vertexColors:true,blending:T.AdditiveBlending,vertexShader:'attribute float size;varying vec3 v;void main(){v=color;vec4 q=modelViewMatrix*vec4(position,1.);gl_PointSize=size*(280./-q.z);gl_Position=projectionMatrix*q}',fragmentShader:'varying vec3 v;void main(){vec2 q=gl_PointCoord-.5;float d=dot(q,q),g=exp(-28.*d),core=smoothstep(.12,0.,d);gl_FragColor=vec4(v*(g+core),g+core)}'}),pts=new T.Points(g,mat);s.add(pts);c.position.z=9;const v=document.querySelector('#video'),st=document.querySelector('#status'),btn=document.querySelector('#cameraBtn');let lm,last=-1,tx=0,ty=0,z=9,morph=0;async function cam(){btn.disabled=true;try{if(!isSecureContext)throw Error('secure');if(!navigator.mediaDevices?.getUserMedia)throw Error('media');const f=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');lm=await HandLandmarker.createFromOptions(f,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO'});v.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'}});await v.play();st.textContent='HAND TRACKING READY';btn.textContent='摄像头已连接'}catch(e){st.textContent=e.message==='secure'?'请用 HTTPS 或 localhost 打开':e.name==='NotAllowedError'?'权限被拒绝，请允许摄像头':'摄像头启动失败，可重试';btn.disabled=false;btn.textContent='重试摄像头'}}btn.onclick=cam;function loop(t){requestAnimationFrame(loop);if(lm&&v.readyState>1&&v.currentTime!==last){last=v.currentTime;let h=lm.detectForVideo(v,performance.now()).landmarks?.[0];if(h){let q=h[9],f=Math.hypot(h[8].x-h[0].x,h[8].y-h[0].y)<.22;tx=(q.x-.5)*1.8;ty=-(q.y-.5)*1.1;z=f?12:6;morph=f?0:Math.min(1,q.y*1.45);st.textContent=f?'握拳 · 银河光圈':'张掌 · 人物聚合'}}let a=g.attributes.position.array;for(let i=0;i<a.length;i++)a[i]+=(to[i]*morph-a[i])*.025;pts.rotation.y+=(tx-pts.rotation.y)*.03;pts.rotation.x+=(ty-pts.rotation.x)*.03;pts.rotation.z+=.0007;c.position.z+=(z-c.position.z)*.035;r.render(s,c)}loop(0)</script></body></html>
