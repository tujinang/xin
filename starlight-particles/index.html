<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星语粒子·手势版</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#ffd9ae;font:14px sans-serif}#hud{position:fixed;z-index:2;inset:24px;border:1px solid #6b4628;padding:20px;pointer-events:none}#status{float:right}#cameraBtn{position:fixed;z-index:3;right:45px;bottom:45px;padding:10px;background:#160b04;color:#ffd9ae;border:1px solid #ff9e4a;cursor:pointer}video{position:fixed;z-index:2;right:45px;bottom:90px;width:160px;opacity:.55;transform:scaleX(-1)}</style></head><body><div id="hud">STELLAR VOICE / SUPERNOVA CORE <span id="status">等待摄像头</span><p>张开手掌推进 · 握拳拉远 · 移动手掌旋转</p></div><button id="cameraBtn">启动摄像头</button><video id="video" autoplay muted playsinline></video><script type="module">import*as THREE from'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';import{HandLandmarker,FilesetResolver}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';let s=new THREE.Scene(),c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100),r=new THREE.WebGLRenderer({antialias:true}),p,t={x:0,y:0,z:8},m={...t},v=document.querySelector('#video'),lm,last=-1; r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);function pts(n,rad,white=false){let g=new THREE.BufferGeometry(),a=new Float32Array(n*3),co=new Float32Array(n*3);for(let i=0;i<n;i++){let u=Math.random()*2-1,q=Math.sqrt(1-u*u),z=Math.random()*6.28,j=i*3;a[j]=q*Math.cos(z)*rad*(.8+Math.random()*.4);a[j+1]=u*rad;a[j+2]=q*Math.sin(z)*rad*(.8+Math.random()*.4);co[j]=white?.9:1;co[j+1]=white?.9:.2+Math.random()*.5;co[j+2]=white?.9:.05}g.setAttribute('position',new THREE.BufferAttribute(a,3));g.setAttribute('color',new THREE.BufferAttribute(co,3));return new THREE.Points(g,new THREE.PointsMaterial({size:white?.035:.045,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));}p=pts(52000,3.2);s.add(p,pts(3500,4.8,true),pts(3500,5.8,true));c.position.z=8;async function cam(){let st=document.querySelector('#status'),b=document.querySelector('#cameraBtn');b.disabled=true;try{if(!isSecureContext)throw Error('secure');if(!navigator.mediaDevices)throw Error('media');let f=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');lm=await HandLandmarker.createFromOptions(f,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO'});v.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});await v.play();st.textContent='摄像头已连接'}catch(e){st.textContent=e.message==='secure'?'请用 HTTPS 或 localhost 打开':e.name==='NotAllowedError'?'权限被拒绝，请允许摄像头':'摄像头启动失败，可重试';b.disabled=false}}document.querySelector('#cameraBtn').onclick=cam;cam();function loop(){requestAnimationFrame(loop);if(lm&&v.readyState>1&&v.currentTime!==last){last=v.currentTime;let q=lm.detectForVideo(v,performance.now()).landmarks?.[0];if(q){t.x=(q[9].x-.5)*5;t.y=-(q[9].y-.5)*3;t.z=Math.hypot(q[8].x-q[0].x,q[8].y-q[0].y)<.22?12:6;document.querySelector('#status').textContent='HAND TRACKING'}}m.x+=(t.x-m.x)*.06;m.y+=(t.y-m.y)*.06;m.z+=(t.z-m.z)*.035;c.position.z=m.z;c.lookAt(0,0,0);p.rotation.y+=.0012;p.rotation.x=m.y*.02;r.render(s,c)}loop();</script></body></html>
