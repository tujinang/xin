<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星语粒子 · 手势超新星</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,"Microsoft YaHei",sans-serif}#scene{position:fixed;inset:0}#hud{position:fixed;inset:24px;pointer-events:none;border:1px solid rgba(255,180,90,.28);box-shadow:inset 0 0 80px rgba(255,130,40,.08)}#hud:before,#hud:after{content:"";position:absolute;width:34px;height:34px;border-color:#ffb35c;border-style:solid;opacity:.8}#hud:before{top:-1px;left:-1px;border-width:2px 0 0 2px}#hud:after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}.title{position:absolute;top:22px;left:28px;letter-spacing:.28em;color:#ffd9ae;font-size:12px}.status{position:absolute;right:28px;top:22px;color:#ffb35c;font-size:12px;letter-spacing:.16em}.hint{position:absolute;bottom:24px;left:28px;color:#a78f80;font-size:12px;line-height:1.8}.video{position:fixed;right:34px;bottom:34px;width:150px;border:1px solid rgba(255,180,90,.35);opacity:.6;transform:scaleX(-1)}
</style></head><body><div id="scene"></div><div id="hud"><div class="title">STELLAR VOICE / SUPERNOVA CORE</div><div class="status" id="status">等待手势扫描</div><div class="hint">张开手掌：推进镜头　握拳：拉远镜头<br>移动手掌：旋转超新星　摄像头权限仅用于本地交互</div></div><video id="video" class="video" autoplay muted playsinline></video><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';
import {HandLandmarker,FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';
const C={count:52000,min:4.8,max:15,damping:.06};let scene,camera,renderer,core,ring1,ring2,handLandmarker,video,lastVideo=-1;const target={x:0,y:0,z:8},motion={x:0,y:0,z:8};
function initThree(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.z=motion.z;renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.querySelector('#scene').appendChild(renderer.domElement);core=particles(C.count,3.1);scene.add(core);ring1=ring(4.4,1.0,1800);ring2=ring(5.5,1.5,2200);scene.add(ring1,ring2);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
function material(){return new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true,uniforms:{uSize:{value:1}},vertexShader:'attribute float size;varying vec3 vColor;void main(){vColor=color;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=size*(300./-mv.z);gl_Position=projectionMatrix*mv;}',fragmentShader:'varying vec3 vColor;void main(){vec2 p=gl_PointCoord-.5;float r=dot(p,p);float glow=exp(-12.*r);float core=smoothstep(.18,.0,r);gl_FragColor=vec4(vColor*(glow+core),glow+core);}'} )}
function particles(n,r){const g=new THREE.BufferGeometry(),p=new Float32Array(n*3),c=new Float32Array(n*3),s=new Float32Array(n);for(let i=0;i<n;i++){const u=Math.random()*2-1,a=Math.random()*Math.PI*2,q=Math.sqrt(1-u*u)*r*(.82+Math.random()*.3),j=i*3;p[j]=q*Math.cos(a);p[j+1]=u*r*(.82+Math.random()*.3);p[j+2]=q*Math.sin(a);c[j]=1;c[j+1]=.2+Math.random()*.55;c[j+2]=.02+Math.random()*.12;s[i]=1.4+Math.random()*2.5}g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));g.setAttribute('size',new THREE.BufferAttribute(s,1));return new THREE.Points(g,material())}
function ring(rad,w,n){const g=new THREE.BufferGeometry(),p=new Float32Array(n*3),c=new Float32Array(n*3),s=new Float32Array(n);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=rad+(Math.random()-.5)*w,j=i*3;p[j]=Math.cos(a)*r;p[j+1]=(Math.random()-.5)*.16;p[j+2]=Math.sin(a)*r;c[j]=c[j+1]=c[j+2]=.9;s[i]=1+Math.random()*1.8}g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));g.setAttribute('size',new THREE.BufferAttribute(s,1));return new THREE.Points(g,material())}
async function initMediaPipe(){try{const fileset=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');handLandmarker=await HandLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1});video.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240}});document.querySelector('#status').textContent='手势扫描已就绪'}catch(e){document.querySelector('#status').textContent='未启用摄像头 · 鼠标可控'}}
function updateHand(){if(!handLandmarker||video.readyState<2||video.currentTime===lastVideo)return;lastVideo=video.currentTime;const r=handLandmarker.detectForVideo(video,performance.now());if(!r.landmarks?.length)return;const h=r.landmarks[0],p=h[9],spread=Math.hypot(h[8].x-h[0].x,h[8].y-h[0].y),fist=spread<.22;target.x=(p.x-.5)*5;target.y=-(p.y-.5)*3;target.z=fist?12:6;document.querySelector('#status').textContent=fist?'握拳 · 拉远':'张掌 · 推进'}
function animate(t){requestAnimationFrame(animate);updateHand();motion.x+=(target.x-motion.x)*C.damping;motion.y+=(target.y-motion.y)*C.damping;motion.z+=(target.z-motion.z)*.035;camera.position.z=Math.max(C.min,Math.min(C.max,motion.z));camera.lookAt(0,0,0);core.rotation.y+=.0012;core.rotation.x=motion.y*.025;ring1.rotation.y+=.003;ring2.rotation.y-=.0014;renderer.render(scene,camera)}
initThree();initMediaPipe();animate();
</script></body></html>
