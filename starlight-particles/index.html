<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星语粒子·手势版</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#ffd9ae;font:14px sans-serif}#hud{position:fixed;z-index:2;inset:24px;border:1px solid #6b4628;padding:20px;pointer-events:none}#status{float:right}#cameraBtn{position:fixed;z-index:3;right:45px;bottom:45px;padding:10px;background:#160b04;color:#ffd9ae;border:1px solid #ff9e4a;cursor:pointer}video{position:fixed;z-index:2;right:45px;bottom:90px;width:160px;opacity:.55;transform:scaleX(-1)}</style><div id="hud">STELLAR VOICE / HAND EDITION <span id="status">点击启动摄像头</span><p>张开手掌推进 · 握拳拉远 · 移动手掌旋转<br>提示：请通过 HTTPS 或 localhost 打开</p></div><button id="cameraBtn">启动摄像头</button><video id="video" autoplay muted playsinline></video><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';import{HandLandmarker,FilesetResolver}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';const s=new T.Scene(),c=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,100),r=new T.WebGLRenderer({antialias:true}),N=52000,g=new T.BufferGeometry(),a=new Float32Array(N*3),b=new Float32Array(N*3),col=new Float32Array(N);for(let i=0;i<N;i++){let j=i*3,u=Math.random()*2-1,q=Math.sqrt(1-u*u),z=Math.random()*6.28,rad=3.2*(.8+Math.random()*.4);a[j]=q*Math.cos(z)*rad;a[j+1]=u*rad;a[j+2]=q*Math.sin(z)*rad;let k=i%3,p=k===0?-1.65:k===1?0:1.65;b[j]=k===1?Math.cos(z)*.85:p+(Math.random()-.5)*1.5;b[j+1]=k===1?1.3+Math.sin(z)*1.05:-.55+Math.random()*1.5;b[j+2]=(Math.random()-.5)*.5;col[j]=k===0?1:k===1?.35:.8}g.setAttribute('position',new T.BufferAttribute(a,3));g.setAttribute('color',new T.BufferAttribute(new Float32Array([...col].flatMap(x=>[x,.25+.5*Math.random(),.08+.9*Math.random()])),3));const p=new T.Points(g,new T.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.92,blending:T.AdditiveBlending}));s.add(p);c.position.z=8;r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);const v=document.querySelector('#video'),st=document.querySelector('#status'),btn=document.querySelector('#cameraBtn');let lm,last=-1,tx=0,ty=0,z=8,morph=0;async function cam(){btn.disabled=true;try{if(!isSecureContext)throw Error('secure');if(!navigator.mediaDevices?.getUserMedia)throw Error('media');const f=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');lm=await HandLandmarker.createFromOptions(f,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO'});v.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'}});await v.play();st.textContent='HAND TRACKING READY';btn.textContent='摄像头已连接'}catch(e){st.textContent=e.message==='secure'?'请用 HTTPS 或 localhost 打开':e.name==='NotAllowedError'?'权限被拒绝，请在浏览器设置中允许':'摄像头启动失败，可重试';btn.disabled=false;btn.textContent='重试摄像头'}}btn.onclick=cam;function loop(){requestAnimationFrame(loop);if(lm&&v.readyState>1&&v.currentTime!==last){last=v.currentTime;let h=lm.detectForVideo(v,performance.now()).landmarks?.[0];if(h){let q=h[9],f=Math.hypot(h[8].x-h[0].x,h[8].y-h[0].y)<.22;tx=(q.x-.5)*5;ty=-(q.y-.5)*3;z=f?12:6;morph=Math.min(1,Math.max(0,q.y*1.45));st.textContent=f?'握拳 · 拉远':'张掌 · 人物聚合'}}let pos=g.attributes.position.array;for(let i=0;i<N*3;i++)pos[i]+=(a[i]*(1-morph)+b[i]*morph-pos[i])*.045;c.position.z+=(z-c.position.z)*.035;p.rotation.y+=(tx-p.rotation.y)*.04;p.rotation.x+=(ty-p.rotation.x)*.04;p.rotation.y+=.001;r.render(s,c)}loop();</script></html>
