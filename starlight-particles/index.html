<!doctype html><meta charset="utf-8"><title>星语粒子手势版</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#01020a}#hud{position:fixed;z-index:2;color:#bdeeff;padding:24px;border:1px solid #286b9b;inset:24px;pointer-events:none;font:14px system-ui}#cameraBtn{position:fixed;z-index:3;right:48px;bottom:48px;padding:10px;background:#071a30;color:#bdeeff;border:1px solid #60cfff}</style><div id="hud">STELLAR VOICE / HAND EDITION <span id="status">点击启动摄像头</span><br><small>张掌聚合人物 · 握拳回到银河光圈 · 移动手掌旋转</small></div><button id="cameraBtn">启动摄像头</button><video id="video" autoplay muted playsinline style="position:fixed;right:48px;bottom:95px;width:160px;opacity:.5;transform:scaleX(-1)"></video><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js';import{HandLandmarker,FilesetResolver}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';const scene=new T.Scene(),cam=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,100),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);const N=52000,pos=new Float32Array(N*3),target=new Float32Array(N*3),colors=new Float32Array(N*3);for(let i=0;i<N;i++){let j=i*3,a=Math.random()*Math.PI*2,rad=1+Math.random()*5;pos[j]=Math.cos(a)*rad;pos[j+1]=Math.sin(a)*rad*.35;pos[j+2]=Math.sin(a)*rad*.2;let k=i%3,x=k===0?-1.7:k===1?0:1.7;target[j]=x+(Math.random()-.5)*1.6;target[j+1]=i%5<3?1.2+(Math.random()-.5)*1.8:-.4+Math.random()*1.8;target[j+2]=(Math.random()-.5)*.5;colors[j]=k===0?1:.3;colors[j+1]=k===1?.35:.75;colors[j+2]=1}const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(pos,3));geo.setAttribute('color',new T.BufferAttribute(colors,3));const points=new T.Points(geo,new T.PointsMaterial({size:.06,vertexColors:true,transparent:true,opacity:.95,blending:T.AdditiveBlending,depthWrite:false}));scene.add(points);cam.position.z=9;const video=document.querySelector('#video'),status=document.querySelector('#status'),button=document.querySelector('#cameraBtn');let lm,last=-1,tx=0,ty=0,zoom=9,morph=0;async function startCamera(){button.disabled=true;try{if(!isSecureContext)throw Error('secure');if(!navigator.mediaDevices?.getUserMedia)throw Error('media');const f=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');lm=await HandLandmarker.createFromOptions(f,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO'});video.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'}});await video.play();status.textContent='HAND TRACKING READY';button.textContent='摄像头已连接'}catch(e){status.textContent=e.message==='secure'?'请用 HTTPS 或 localhost 打开':e.name==='NotAllowedError'?'权限被拒绝':'摄像头启动失败，可重试';button.disabled=false;button.textContent='重试摄像头'}}button.onclick=startCamera;function loop(){requestAnimationFrame(loop);if(lm&&video.readyState>1&&video.currentTime!==last){last=video.currentTime;const h=lm.detectForVideo(video,performance.now()).landmarks?.[0];if(h){const q=h[9],f=Math.hypot(h[8].x-h[0].x,h[8].y-h[0].y)<.22;tx=(q.x-.5)*1.8;ty=-(q.y-.5)*1.1;zoom=f?12:6;morph=f?0:Math.min(1,q.y*1.45);status.textContent=f?'握拳 · 银河光圈':'张掌 · 人物聚合'}}const a=geo.attributes.position.array;for(let i=0;i<a.length;i++)a[i]+=(target[i]*morph-a[i])*.03;points.rotation.y+=(tx-points.rotation.y)*.04;points.rotation.x+=(ty-points.rotation.x)*.04;points.rotation.z+=.0008;cam.position.z+=(zoom-cam.position.z)*.04;renderer.render(scene,cam)}loop()</script>
